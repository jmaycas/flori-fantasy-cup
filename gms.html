<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>General Managers · FLORI Fantasy Cup</title>
  <link rel="icon" href="assets/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main id="main" class="wrap">
    <div class="page-head">
      <p class="kicker">Front offices</p>
      <h1>General Managers</h1>
      <p class="lede">The people behind the eight franchises. League members only.</p>
    </div>
    <div id="content"></div>
  </main>

  <script type="module">
    import { mountChrome, el, crownsOf, franchiseStats, passwordGate } from "./js/ui.js";

    const cfg = await mountChrome("gms");
    const content = document.getElementById("content");
    const SESSION_KEY = "flori.gms.key";

    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

    async function deriveKey(password, salt, iterations) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt, iterations },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    }

    async function decrypt(key, enc) {
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ciphertext));
      return JSON.parse(new TextDecoder().decode(plain));
    }

    function readSession() {
      try { return sessionStorage.getItem(SESSION_KEY); } catch { return null; }
    }
    function writeSession(v) {
      try { sessionStorage.setItem(SESSION_KEY, v); } catch { /* private mode: ask again next time */ }
    }

    // One row per GM: the trading card plus the bio panel beside it (stacked on phones).
    function gmRow(team, gm) {
      const st = franchiseStats(cfg, team.id);
      const champ = st.titles > 0;
      const name = gm?.gm_name || "";
      const abilities = (gm?.abilities || []).filter(Boolean);

      const photo = gm?.photo
        ? el("img", { class: "photo", src: gm.photo, alt: name ? `Photo of ${name}` : `General Manager of ${team.name}` })
        : el("div", { class: "placeholder" }, el("img", { src: team.logo, alt: "" }), "Photo coming");

      const tags = el("div", { class: "tcard-tags" },
        team.initials ? el("span", { class: "tcard-initials", title: `${team.name} initials` }, team.initials) : null,
        champ ? el("span", { class: "tcard-crowns", role: "img", "aria-label": `${st.titles} title${st.titles > 1 ? "s" : ""}` }, crownsOf(cfg, team.id)) : null);

      const banner = el("div", { class: "tcard-banner" },
        el("div", { class: "tcard-name" }, name || "General Manager"),
        gm?.nickname ? el("div", { class: "tcard-nick", lang: "es" }, `“${gm.nickname}”`) : null,
        el("div", { class: "tcard-role" },
          name ? ["General Manager", el("span", { class: "sep", "aria-hidden": "true" }, "·")] : null,
          team.name));

      const abilityRow = el("div", { class: "tcard-abilities", "aria-label": "Abilities" },
        abilities.length
          ? abilities.slice(0, 3).map(a => el("span", { class: "ability", lang: "es" }, a))
          : el("span", { class: "ability soon" }, "Coming soon"));

      const stats = el("dl", { class: "tcard-stats" },
        el("div", {}, el("dt", {}, "Seasons"), el("dd", {}, st.seasons)),
        el("div", {}, el("dt", {}, "Titles"), el("dd", {}, st.titles)),
        el("div", {}, el("dt", {}, `${cfg.league.season} pick`), el("dd", {}, `#${st.pick}`)));

      const card = el("article", { class: `tcard${champ ? " champion" : ""}`, style: { "--team": team.color },
          "aria-label": `Trading card: ${name || "General Manager"}, ${team.name}` },
        el("div", { class: "tcard-inner" },
          el("div", { class: "tcard-photo" },
            el("div", { class: "tcard-logo" }, el("img", { src: team.logo, alt: "" })),
            tags, photo, banner),
          abilityRow, stats));

      const panel = el("section", { class: `gm-panel${champ ? " champion" : ""}`, style: { "--team": team.color } },
        el("div", { class: "gm-panel-head" },
          el("img", { src: team.logo, alt: "" }),
          el("div", {},
            el("h2", {}, team.name, champ ? el("span", { class: "crowns", "aria-hidden": "true" }, crownsOf(cfg, team.id)) : null),
            el("div", { class: "meta" }, `Founded ${team.founded}${name ? ` · General Manager: ${name}` : ""}`))),
        gm?.bio
          ? el("p", { class: "gm-bio", lang: "es" }, gm.bio)
          : el("p", { class: "gm-bio soon" }, "Coming soon"));

      return el("div", { class: "gm-row" }, card, panel);
    }

    function render(data) {
      const byTeam = Object.fromEntries((data.gms || []).map(g => [g.team_id, g]));
      const teams = [...cfg.teams].sort((a, b) => a.draft_slot - b.draft_slot);
      content.replaceChildren(el("div", { class: "gm-list" }, teams.map(t => gmRow(t, byTeam[t.id]))));
    }

    let enc = null;
    try {
      const r = await fetch("assets/gms.enc.json", { cache: "no-cache" });
      if (r.ok) enc = await r.json();
    } catch { /* not published */ }

    if (!enc) {
      content.append(el("div", { class: "card empty-state" },
        el("strong", {}, "Bios coming soon"),
        "The commissioner hasn't published the GM bios yet."));
    } else {
      let shown = false;
      const saved = readSession();
      if (saved) {
        try {
          const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]);
          render(await decrypt(key, enc));
          shown = true;
        } catch { /* stale key from an older file: ask again */ }
      }
      if (!shown) {
        content.append(el("div", { class: "card empty-state" },
          el("strong", {}, "Members only"),
          "Enter the league password to see the bios."));
        await passwordGate({
          title: "League members only",
          message: "The General Managers' bios are for the eight GMs. Enter the league password.",
          check: async pw => {
            const key = await deriveKey(pw, b64(enc.salt), enc.iterations);
            const data = await decrypt(key, enc);
            writeSession(toB64(await crypto.subtle.exportKey("raw", key)));
            render(data);
            return true;
          },
        });
      }
    }
  </script>
</body>
</html>
