<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pablete ESPN ☕ · FLORI Fantasy Cup</title>
  <link rel="icon" href="assets/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main id="main" class="wrap">
    <div class="page-head">
      <p class="kicker">Morning debrief</p>
      <h1>Pablete ESPN ☕</h1>
    </div>
    <div id="pablete" data-state="loading" aria-live="polite">
      <div class="card empty-state"><strong>Brewing the Pablete…</strong>Fetching the latest numbers from the league sheet.</div>
    </div>
  </main>

  <script type="module" src="js/pablete.js"></script>
  <script>
    (function () {
      var box = document.getElementById("pablete");
      function fail(title, text) {
        box.setAttribute("data-state", "error");
        box.innerHTML = '<div class="card empty-state" role="alert"><strong>' + title + '</strong>' + text + '</div>';
      }
      // Opened as a file: browsers block the page's modules, so say how to open it instead.
      if (location.protocol === "file:") {
        fail("Open via a local server: python3 -m http.server",
             "This page can't load its data from a file. Run the command in the site folder and open http://localhost:8000/pablete.html.");
        return;
      }
      // Safety net: if the page script never runs (old browser, failed download), don't stay on "loading".
      setTimeout(function () {
        if (box.getAttribute("data-state") === "loading") fail("The Pablete can't load right now.", "Try reloading the page in a minute.");
      }, 25000);
    })();
  </script>
</body>
</html>
